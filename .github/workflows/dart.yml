# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  dart-packages:
    runs-on: ubuntu-latest

    # This is a monorepo — there is no pubspec.yaml at the repo root, only
    # inside these package directories — so each Dart package is built and
    # tested independently.
    strategy:
      matrix:
        package:
          - server/dart_frog_api
          - packages/shared_models
          - scripts

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603

      - name: Install dependencies
        run: dart pub get

      - name: Analyze project source
        run: dart analyze

      - name: Run tests
        run: dart test
        # Only server/dart_frog_api and packages/shared_models have a test/
        # suite today; scripts has none yet.
        if: matrix.package != 'scripts'

  flutter-app:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/flutter_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
