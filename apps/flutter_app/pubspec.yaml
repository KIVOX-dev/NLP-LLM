name: flutter_app
description: >
  SanskritAI Translator — Flutter client (Android, iOS, Web, Windows, macOS,
  Linux). Talks only to the Dart Frog backend; never calls MongoDB or any
  LLM provider directly.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  shared_models:
    path: ../../packages/shared_models
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# NOTE: platform runner directories (android/, ios/, web/, windows/, macos/,
# linux/) are intentionally not checked in from this scaffold — they must be
# generated by the Flutter SDK itself (not hand-authored) via:
#   flutter create --platforms=android,ios,web,windows,macos,linux --org com.sanskritai .
# Run that once from this directory before `flutter run`. See docs/RUNNING.md.
